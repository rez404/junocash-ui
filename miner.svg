<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circles with gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle -->
  <circle cx="512" cy="512" r="480" fill="url(#grad1)"/>

  <!-- Inner circle -->
  <circle cx="512" cy="512" r="400" fill="url(#grad2)"/>

  <!-- Mining pickaxe icon -->
  <g transform="translate(512, 512)">
    <!-- Pickaxe handle -->
    <rect x="-10" y="80" width="20" height="280" rx="10" fill="white" opacity="0.9"/>

    <!-- Pickaxe head -->
    <g transform="rotate(-45)">
      <rect x="-140" y="-40" width="280" height="60" rx="12" fill="white"/>
      <!-- Left spike -->
      <path d="M -140 -40 L -140 20 L -200 -10 Z" fill="white"/>
      <!-- Right spike -->
      <path d="M 140 -40 L 140 20 L 200 -10 Z" fill="white"/>
    </g>

    <!-- Coin stack -->
    <g transform="translate(0, -200)">
      <!-- Top coin -->
      <ellipse cx="0" cy="-60" rx="80" ry="25" fill="#FFD700" stroke="white" stroke-width="4"/>
      <ellipse cx="0" cy="-55" rx="80" ry="25" fill="#FFC700"/>

      <!-- Middle coin -->
      <ellipse cx="0" cy="-30" rx="80" ry="25" fill="#FFD700" stroke="white" stroke-width="4"/>
      <ellipse cx="0" cy="-25" rx="80" ry="25" fill="#FFC700"/>

      <!-- Bottom coin -->
      <ellipse cx="0" cy="0" rx="80" ry="25" fill="#FFD700" stroke="white" stroke-width="4"/>
      <ellipse cx="0" cy="5" rx="80" ry="25" fill="#FFC700"/>

      <!-- Dollar sign on top coin -->
      <text x="0" y="-45" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">$</text>
    </g>

    <!-- Shield/security symbol -->
    <g transform="translate(150, 150) scale(0.6)">
      <path d="M 0 -80 L 60 -50 L 60 30 Q 60 80 0 120 Q -60 80 -60 30 L -60 -50 Z"
            fill="white" opacity="0.8" stroke="white" stroke-width="4"/>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="70" font-weight="bold" fill="url(#grad2)" text-anchor="middle" dominant-baseline="middle">J</text>
    </g>
  </g>
</svg>
